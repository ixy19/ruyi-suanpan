<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>茹意算盤｜管理者後台（免登入測試版）</title>
<link rel="stylesheet" href="styles.css">
<!-- 載入 Supabase JS 客戶端 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.admin-container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
.admin-panel { background: #f7f8fa; border: 1px solid var(--line); border-radius: 8px; padding: 24px; margin-bottom: 24px; }
.admin-panel h2 { margin-top: 0; color: var(--navy); }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-weight: 700; margin-bottom: 5px; font-size: 13px; color: var(--navy); }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #dce2e8; border-radius: 6px; font: inherit; }
.btn-row { display: flex; gap: 10px; margin-top: 15px; }
.article-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--line); background: #fff; margin-bottom: 8px; border-radius: 6px; }
</style>
</head>
<body>

<header class="site-header">
<a class="brand" href="index.html"><span class="brand-mark">如</span><span>茹意算盤<small>Stay Ahead, Stay Protected.</small></span></a>
<nav><a href="index.html">返回前台首頁</a></nav>
</header>

<main class="admin-container">
  <div class="admin-panel" style="display:flex; justify-content:space-between; align-items:center;">
    <div>
      <h2 style="margin:0; font-size:16px;">後台管理模式（測試版）</h2>
      <span style="font-size:11px; color:var(--gold);">已成功連接 Supabase 雲端資料庫</span>
    </div>
  </div>

  <!-- 新增 / 編輯文章表單 -->
  <div class="admin-panel">
    <h2 id="formTitle">發布新文章 / 編輯文章</h2>
    <form id="articleForm">
      <input type="hidden" id="articleId">
      <div class="form-group">
        <label>文章標題 (Title)</label>
        <input type="text" id="artTitle" required placeholder="例如：Day 9｜美國信託規劃...">
      </div>
      <div class="form-group">
        <label>網址代稱 (Slug - 英文半形與連字號)</label>
        <input type="text" id="artSlug" required placeholder="例如：day-9-trust-planning">
      </div>
      <div class="form-group">
        <label>分類</label>
        <select id="artCategory">
          <option value="retirement">退休理財規劃</option>
          <option value="education">教育基金與子女規劃</option>
          <option value="business-tax">生意與稅務規劃</option>
          <option value="legacy">遺產傳承與資產保護</option>
          <option value="market">市場觀察與財經知識</option>
          <option value="resources">課程與其他素材</option>
        </select>
      </div>
      <div class="form-group">
        <label>文章摘要 (Excerpt)</label>
        <textarea id="artExcerpt" rows="3" placeholder="請輸入文章簡短摘要..."></textarea>
      </div>
      <div class="form-group">
        <label>來源檔名 (Source)</label>
        <input type="text" id="artSource" value="Admin Published">
      </div>
      <div class="btn-row">
        <button type="submit" class="btn primary">儲存至雲端資料庫</button>
        <button type="button" id="resetFormBtn" class="btn secondary">清除重填</button>
      </div>
    </form>
  </div>

  <!-- 現有雲端文章清單 -->
  <div class="admin-panel">
    <h2>雲端文章列表</h2>
    <div id="adminArticleList">正在載入文章...</div>
  </div>
</main>

<script>
  const SUPABASE_URL = "https://nnzknvhyfyfvwcvzsehg.supabase.co";
  const SUPABASE_KEY = "sb_publishable_8YUNF2yAUi_jH5oLYeTxjQ_XfKA1Ezh";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const articleForm = document.getElementById('articleForm');
  const adminArticleList = document.getElementById('adminArticleList');

  // 載入後台文章列表
  async function loadAdminArticles() {
    const { data, error } = await supabase.from('articles').select('*').order('id', { ascending: false });
    if (error) {
      adminArticleList.innerHTML = "<p>載入文章失敗：" + error.message + "</p>";
      return;
    }
    if (!data || data.length === 0) {
      adminArticleList.innerHTML = "<p>目前雲端資料庫沒有任何文章。</p>";
      return;
    }
    adminArticleList.innerHTML = data.map(a => `
      <div class="article-row">
        <div>
          <strong>${escapeHTML(a.title)}</strong><br>
          <small style="color:var(--muted)">分類：${a.category} | 代稱：${a.slug}</small>
        </div>
        <div>
          <button class="btn secondary" onclick="editArticle(${a.id}, '${escapeHTML(a.title)}', '${a.slug}', '${a.category}', '${escapeHTML(a.excerpt||'')}')" style="padding:6px 12px; font-size:11px;">編輯</button>
          <button class="btn secondary" onclick="deleteArticle(${a.id})" style="padding:6px 12px; font-size:11px; color:red; border-color:red;">刪除</button>
        </div>
      </div>
    `).join('');
  }

  // 儲存文章 (新增或更新)
  articleForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('articleId').value;
    const title = document.getElementById('artTitle').value.trim();
    const slug = document.getElementById('artSlug').value.trim();
    const category = document.getElementById('artCategory').value;
    const excerpt = document.getElementById('artExcerpt').value.trim();
    const source = document.getElementById('artSource').value.trim();

    const payload = { title, slug, category, excerpt, source, paragraphs: 10, kind: "雲端後台發布" };

    let res;
    if (id) {
      res = await supabase.from('articles').update(payload).eq('id', id);
    } else {
      res = await supabase.from('articles').insert([payload]);
    }

    if (res.error) {
      alert("儲存失敗：" + res.error.message);
    } else {
      alert("文章儲存成功！");
      articleForm.reset();
      document.getElementById('articleId').value = "";
      loadAdminArticles();
    }
  });

  // 刪除文章
  window.deleteArticle = async function(id) {
    if (!confirm("確定要刪除這篇文章嗎？")) return;
    const { error } = await supabase.from('articles').delete().eq('id', id);
    if (error) alert("刪除失敗：" + error.message);
    else loadAdminArticles();
  };

  // 帶入編輯
  window.editArticle = function(id, title, slug, category, excerpt) {
    document.getElementById('articleId').value = id;
    document.getElementById('artTitle').value = title;
    document.getElementById('artSlug').value = slug;
    document.getElementById('artCategory').value = category;
    document.getElementById('artExcerpt').value = excerpt;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('resetFormBtn').addEventListener('click', () => {
    articleForm.reset();
    document.getElementById('articleId').value = "";
  });

  function escapeHTML(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

  loadAdminArticles();
</script>
</body>
</html>
